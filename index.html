<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phả Hệ Dòng Họ – Cây Gia Phả Trực Quan</title>
    <meta name="description" content="Ứng dụng Single Page Application hiển thị và quản lý Cây Phả Hệ Dòng Họ tương tác trực quan." />
    <meta property="og:title" content="Phả Hệ Dòng Họ – Cây Gia Phả Trực Quan" />
    <meta property="og:description" content="Ứng dụng Single Page Application hiển thị và quản lý Cây Phả Hệ Dòng Họ tương tác trực quan." />
    <meta property="og:type" content="website" />

    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    

    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Pre-paint Theme Script (Chống nhấp nháy FOUC) -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('app_theme')
          var isDark = false
          if (saved === 'dark') {
            isDark = true
          } else if (saved === 'light') {
            isDark = false
          } else {
            // system or default
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          }

          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light')
          if (isDark) {
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.remove('dark')
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>

    <!-- Nền tối ngay từ paint đầu tiên -->
    <style>
      html.dark, html.dark body { background-color: #0a0e18; }
    </style>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
